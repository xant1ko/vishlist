# Публичная HTTPS-замена nginx-revers для нового кластера.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vishlist
spec:
  ingressClassName: traefik # Обнаруженный Ingress Controller в кластере.
  tls:
    - hosts: [iwant.xant1ko.ru] # Домен должен указывать на IP внешнего Traefik нового кластера.
      secretName: vishlist-tls # TLS Secret создаётся вручную из сертификата Let's Encrypt.
  rules:
    - host: iwant.xant1ko.ru # Основной публичный адрес приложения.
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vishlist-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vishlist-web
                port:
                  number: 80
