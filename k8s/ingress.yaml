# Публичная HTTPS-замена nginx-revers для нового кластера.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vishlist
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts: [iwant.xant1ko.ru]
      secretName: vishlist-tls
  rules:
    - host: iwant.xant1ko.ru
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vishlist-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vishlist-web
                port:
                  number: 80
