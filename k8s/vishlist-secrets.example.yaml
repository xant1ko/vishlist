# ШАБЛОН: скопируйте вне Git, замените CHANGE_ME_* и примените копию.
apiVersion: v1
kind: Secret
metadata:
  name: vishlist-secrets # На этот Secret ссылаются MongoDB и API.
  namespace: kls-2 # Создавайте Secret в namespace нового кластера.
type: Opaque
stringData: # Kubernetes сам кодирует эти обычные строки в Secret.
  MONGO_INITDB_ROOT_USERNAME: CHANGE_ME_MONGO_USER # Учётная запись администратора MongoDB.
  MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME_MONGO_PASSWORD # Пароль администратора MongoDB.
  MONGO_DATABASE: vishlist # Имя прикладной базы данных, с которой работает API.
  JWT_SECRET: CHANGE_ME_LONG_RANDOM_VALUE # Длинный случайный секрет подписи JWT.
