# MongoDB остаётся приватной: API подключается к Service по имени `mongodb`.
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  selector:
    app: mongodb # Находим Pod StatefulSet по этой метке.
  ports:
    - port: 27017 # Внутренний порт MongoDB.
---
# StatefulSet нужен базе, чтобы PVC всегда принадлежал одному Pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vishlist-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vishlist-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db # Каталог данных MongoDB сохраняется на PVC.
          startupProbe: # Даёт MongoDB до двух минут на инициализацию базы.
            tcpSocket:
              port: 27017
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe: # Перезапускает контейнер, если MongoDB перестала принимать соединения.
            tcpSocket:
              port: 27017
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources: # Обязательны ResourceQuota namespace kls-2.
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi # Начальный объём базы; увеличьте при необходимости.
